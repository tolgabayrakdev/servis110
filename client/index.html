<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#142033" />
    <meta name="description" content="Servis110 dijital servis ve bakım yönetim platformu" />
    <title>Servis110 | Dijital Servis Yönetimi</title>
    <script>
      (function () {
        var theme = "light";
        try {
          var savedTheme = localStorage.getItem("servis110-theme");
          if (savedTheme === "light" || savedTheme === "dark" || savedTheme === "system") {
            theme = savedTheme;
          }
        } catch (_) {}

        var resolvedTheme = theme === "system"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : theme;
        var root = document.documentElement;
        root.classList.add(resolvedTheme);
        root.style.colorScheme = resolvedTheme;
        root.style.backgroundColor = resolvedTheme === "dark" ? "#0b1220" : "#f7f8fa";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
